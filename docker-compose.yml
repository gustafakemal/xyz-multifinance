version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: xyz-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-xyz_multifinance}
      MYSQL_USER: ${DB_USER:-xyz_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-xyz_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - xyz-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Application API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xyz-api
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-xyz_user}
      DB_PASSWORD: ${DB_PASSWORD:-xyz_password}
      DB_NAME: ${DB_NAME:-xyz_multifinance}
      PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - xyz-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql_data:
    driver: local

networks:
  xyz-network:
    driver: bridge

